name: Documentation Tests

on:
  push:
    branches: [master, examples]
  pull_request:
    branches: [master, examples]

permissions:
  contents: read

jobs:
  doctests:
    name: doctests
    runs-on: hanzo-build-linux-amd64

    services:
      redis-stack:
        image: redislabs/client-libs-test:8.8.0
        env:
          TLS_ENABLED: no
          REDIS_CLUSTER: no
          PORT: 6379
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # After checkout, so setup-go's module cache can key off go.mod. Ahead of
      # it the file is not on disk yet and the cache silently degrades to a miss.
      - name: Set up ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test doc examples
        working-directory: ./doctests
        run: make test
